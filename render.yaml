services:
  - type: web
    name: rainier-gate-waits
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: RAINIER_HOST
        value: 0.0.0.0
      - key: RAINIER_PORT
        value: 10000
      - key: RAINIER_DB_PATH
        value: /data/rainier_waits.sqlite3
      - key: ENABLE_BACKGROUND_POLLING
        value: true
      - key: ALLOW_SYNTHETIC_DATA
        value: false
      - key: ACCEPT_REPORT_LOCATIONS
        value: false
      - key: CLOSED_ENTRANCES
        value: ""
      - key: POLL_INTERVAL_SECONDS
        value: 900
      - key: ENABLE_TRAFFIC_POLYLINE
        value: true
      - key: TRAFFIC_POLYLINE_INTERVAL_SECONDS
        value: 3600
      - key: TRAFFIC_POLYLINE_MAX_AGE_MINUTES
        value: 90
      - key: TRAFFIC_POLYLINE_GATE_CONNECTION_METERS
        value: 800
      - key: TRAFFIC_POLYLINE_NORMAL_GAP_METERS
        value: 300
      - key: NISQUALLY_ROUTE_ORIGIN_LAT
        value: 46.751415
      - key: NISQUALLY_ROUTE_ORIGIN_LNG
        value: -121.940160
      - key: NISQUALLY_ROUTE_DESTINATION_LAT
        value: 46.740813
      - key: NISQUALLY_ROUTE_DESTINATION_LNG
        value: -121.915494
      - key: NISQUALLY_ROUTE_VERSION
        value: nisqually-queue-v3
      - key: NISQUALLY_FREE_FLOW_SECONDS
        value: 180
      - key: WHITE_RIVER_ROUTE_ORIGIN_LAT
        value: 46.9160
      - key: WHITE_RIVER_ROUTE_ORIGIN_LNG
        value: -121.6500
      - key: WHITE_RIVER_ROUTE_DESTINATION_LAT
        value: 46.9023
      - key: WHITE_RIVER_ROUTE_DESTINATION_LNG
        value: -121.5358
      - key: WHITE_RIVER_ROUTE_VERSION
        value: white-river-extended-v1
      - key: WHITE_RIVER_FREE_FLOW_SECONDS
        value: 630
      - key: FREE_FLOW_LEARNING_DAYS
        value: 30
      - key: FREE_FLOW_LEARNING_MIN_SAMPLES
        value: 12
      - key: POLL_START_HOUR_LOCAL
        value: 6
      - key: POLL_END_HOUR_LOCAL
        value: 20
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: CURRENT_MAX_AGE_MINUTES
        value: 30
      - key: STALE_MAX_AGE_MINUTES
        value: 60
      - key: ABANDONED_REPORT_RETENTION_HOURS
        value: 24
      - key: REPORT_IDENTIFIER_RETENTION_DAYS
        value: 60
      - key: DEVICE_REPORT_LIMIT_PER_HOUR
        value: 5
      - key: NETWORK_REPORT_LIMIT_PER_HOUR
        value: 60
      - key: REPORT_DIVERGENCE_FACTOR
        value: 3.0
      - key: REPORT_DIVERGENCE_FLOOR_MINUTES
        value: 10
      - key: ESTIMATOR_FIELD_CALIBRATED
        value: false
      - key: ENABLE_HSTS
        value: true
      - key: FEEDBACK_RATE_LIMIT_PER_HOUR
        value: 5
      - key: FEEDBACK_IDENTIFIER_RETENTION_DAYS
        value: 30
      - key: FEEDBACK_RETENTION_DAYS
        value: 365
      - key: RAINIER_BACKUP_DIR
        value: /data/backups
      - key: BACKUP_INTERVAL_HOURS
        value: 24
      - key: BACKUP_RETENTION_COUNT
        value: 7
      - key: RAINIER_HASH_SECRET
        generateValue: true
      - key: RAINIER_ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: WSDOT_ACCESS_CODE
        sync: false
    disk:
      name: rainier-data
      mountPath: /data
      sizeGB: 1
