services:
  rainier-gate-waits:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAINIER_HOST: 0.0.0.0
      RAINIER_DB_PATH: /data/rainier_waits.sqlite3
      POLL_INTERVAL_SECONDS: 900
      POLL_START_HOUR_LOCAL: 6
      POLL_END_HOUR_LOCAL: 20
      ALLOW_SYNTHETIC_DATA: "false"
      ACCEPT_REPORT_LOCATIONS: "false"
      CLOSED_ENTRANCES: ""
      CURRENT_MAX_AGE_MINUTES: 30
      STALE_MAX_AGE_MINUTES: 60
      ABANDONED_REPORT_RETENTION_HOURS: 24
      REPORT_IDENTIFIER_RETENTION_DAYS: 60
      RAINIER_BACKUP_DIR: /data/backups
      BACKUP_INTERVAL_HOURS: 24
      BACKUP_RETENTION_COUNT: 7
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      NPS_API_KEY: ${NPS_API_KEY:-}
      WSDOT_ACCESS_CODE: ${WSDOT_ACCESS_CODE:-}
      RAINIER_ADMIN_TOKEN: ${RAINIER_ADMIN_TOKEN:-}
      RAINIER_HASH_SECRET: ${RAINIER_HASH_SECRET:-replace-before-public-deployment}
    volumes:
      - rainier-data:/data
    restart: unless-stopped

volumes:
  rainier-data:
